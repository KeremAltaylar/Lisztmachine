name: mac

# Builds the app on an Apple Silicon runner (same CPU family as the show's Mac mini M1),
# runs the composer tests, installs Surge XT and renders a minute of Berlin and of Jungle (the
# genre songs, their third-party percussion patches) and a stretch of Trip-Hop with Dexed in it
# (fetched from its GitHub release, bundled in the app's Resources/plugins) to prove the sound path.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15  # 2026-11-14: macos-14 retired ("macos-14-arm64-us-default is not supported")
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Composer tests
        run: ./build/liszt_tests

      - name: Fetch Dexed
        run: |
          curl -sL -o dexed.zip https://github.com/asb2m10/dexed/releases/download/v1.0.1/Dexed-1.0.1-macOS.zip
          mkdir -p dexed plugins && ditto -x -k dexed.zip dexed
          V="$(find dexed -name Dexed.vst3 -maxdepth 4 | head -1)"
          if [ -z "$V" ]; then find dexed -maxdepth 4; exit 1; fi
          cp -R "$V" plugins/

      # No render here: the palettes play plugin synths (OB-Xf, TAL, FB-3300, ...) this machine does not have.
      # Renders happen on Kerem's machines; this checks the build, the composer tests and the app package.

      - name: Package the app
        run: |
          APP="$(find build -name Lisztmachine.app -type d | head -1)"
          mkdir -p "$APP/Contents/Resources/plugins" && cp -R plugins/Dexed.vst3 "$APP/Contents/Resources/plugins/"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" Lisztmachine-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lisztmachine-mac
          path: Lisztmachine-mac.zip
