<title>Synth Sounds</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* The audition room: one card per synth, four sounds each, the same phrase in every one; a like is a lit tile. */
:root {
  --bg: #121315; --panel: #1b1c1f; --well: #0c0d0e; --line: #2b2d31; --ink: #e9e9ec; --dim: #969aa2;
  --accent: #9fd1c3; --accent-ink: #0f1a17; --warn: #f2b45a; --hot: #f06a5a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f1f2f3; --panel: #fafafb; --well: #e2e4e6; --line: #d3d6da; --ink: #1d1f22; --dim: #62666e;
  --accent: #2d7d68; --accent-ink: #f3fbf8; --warn: #a8650a; --hot: #c4362a; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f1f2f3; --panel: #fafafb; --well: #e2e4e6; --line: #d3d6da; --ink: #1d1f22; --dim: #62666e;
  --accent: #2d7d68; --accent-ink: #f3fbf8; --warn: #a8650a; --hot: #c4362a; color-scheme: light }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
main { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 20px; justify-content: space-between; }
h1 { font: 600 32px/1 var(--display); letter-spacing: .02em; margin: 0; }
.lede { color: var(--dim); max-width: 64ch; margin: 6px 0 0; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.count { font: 500 13px var(--mono); color: var(--dim); }
.count b { color: var(--accent); font-weight: 500; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; align-content: start; }
.card h2 { font: 600 21px/1 var(--display); letter-spacing: .03em; margin: 0; }
.card p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
.sounds { display: grid; gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px;
  background: var(--well); border: 1px solid transparent; border-radius: 8px; padding: 8px; overflow: hidden; }
.tile.liked { border-color: var(--accent); }
.tile .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); }
.tile .play { width: 30px; height: 30px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 11px; }
.tile .play[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tile .lab { font: 500 13px/1.2 var(--body); overflow-wrap: break-word; min-width: 0; }
.tile .like { padding: 3px 8px; font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; }
.tile.broken { opacity: .5; }
.tile.broken .lab::after { content: " · did not render"; color: var(--dim); font-size: 12px; }
.notes { display: grid; gap: 6px; }
.notes label { font: 600 12px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
textarea { font: 14px/1.5 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 76px; resize: vertical; width: 100%; box-sizing: border-box; }
#status { min-height: 1.4em; color: var(--dim); font: 400 13px var(--mono); }
#status.err { color: var(--hot); }
.empty { color: var(--dim); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
@media (max-width: 420px) { .sounds { grid-template-columns: minmax(0, 1fr); } }
</style>

<main>
  <header>
    <div>
      <h1>Synth Sounds</h1>
      <p class="lede">Every sound plays the same 12 seconds in D minor: a slow line, then two held chords (B♭, then A). All are levelled to the same loudness. Like the ones you want in the songs; your picks save as you go.</p>
    </div>
    <div class="tools">
      <span class="count" id="count"></span>
      <button id="only" aria-pressed="false">Liked only</button>
      <button id="stop" disabled>Stop</button>
    </div>
  </header>
  <div id="status" role="status"></div>
  <section class="grid" id="grid"><div class="empty">Loading the sounds…</div></section>
  <section class="notes">
    <label for="note">Notes for Claude (which sound for which song or part)</label>
    <textarea id="note" placeholder="e.g. Monique Hairy Growler as the Doom bass, Deputy Basso Oooh for the Halftime choir"></textarea>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const state = { liked: {}, note: "" };
let man = null, onlyLiked = false, db = null, saveTimer = 0;

// playback: one sound at a time through Web Audio (fetched and decoded on first play)
let actx = null, cur = null;
const buffers = {};
async function play(id, tile) {
  if (cur && cur.id === id) return stop();
  stop();
  actx ??= new AudioContext();
  await actx.resume();
  const btn = tile.querySelector('.play');
  btn.textContent = '…';
  try {
    buffers[id] ??= await fetch(`media/${id}.mp3`).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(b => actx.decodeAudioData(b));
  } catch (e) { btn.textContent = '▶'; status(`Could not load that sound (${e.message}).`, true); return; }
  const src = actx.createBufferSource();
  src.buffer = buffers[id];
  src.connect(actx.destination);
  const t0 = actx.currentTime + 0.02, dur = src.buffer.duration;
  src.start(t0);
  cur = { id, src, tile };
  btn.textContent = '■'; btn.setAttribute('aria-pressed', 'true'); $('stop').disabled = false;
  src.onended = () => { if (cur && cur.src === src) stop(); };
  (function tick() { if (!cur || cur.src !== src) return; cur.tile.querySelector('.bar').style.width = Math.min(100, (actx.currentTime - t0) / dur * 100) + '%'; requestAnimationFrame(tick); })();
}
function stop() {
  if (!cur) return;
  try { cur.src.onended = null; cur.src.stop(); } catch {}
  const b = cur.tile.querySelector('.play');
  b.textContent = '▶'; b.setAttribute('aria-pressed', 'false');
  cur.tile.querySelector('.bar').style.width = '0';
  cur = null; $('stop').disabled = true;
}
$('stop').onclick = stop;
addEventListener('keydown', e => { if (e.key === 'Escape') stop(); });

function status(t, err) { $('status').textContent = t; $('status').className = err ? 'err' : ''; }

function render() {
  const grid = $('grid');
  grid.textContent = '';
  let shown = 0, likes = 0;
  for (const s of man.synths) for (const x of s.sounds) if (state.liked[x.id]) likes++;
  for (const s of man.synths) {
    const sounds = s.sounds.filter(x => !onlyLiked || state.liked[x.id]);
    if (!sounds.length) continue;
    const card = document.createElement('article'); card.className = 'card';
    const [name, ...rest] = s.about.split(': ');
    card.innerHTML = '<div><h2></h2><p></p></div><div class="sounds"></div>';
    card.querySelector('h2').textContent = name;
    card.querySelector('p').textContent = rest.join(': ');
    for (const x of sounds) {
      shown++;
      const t = document.createElement('div');
      t.className = 'tile' + (state.liked[x.id] ? ' liked' : '') + (x.ok ? '' : ' broken');
      t.innerHTML = '<button class="play" aria-pressed="false">▶</button><span class="lab"></span><button class="like" aria-pressed="false">Like</button><span class="bar"></span>';
      t.querySelector('.lab').textContent = x.label;
      const play = t.querySelector('.play'), like = t.querySelector('.like');
      play.setAttribute('aria-label', 'Play ' + name + ' ' + x.label);
      play.disabled = !x.ok;
      like.disabled = !x.ok;
      like.setAttribute('aria-pressed', String(!!state.liked[x.id]));
      play.onclick = () => play_(x.id, t);
      like.onclick = () => { if (state.liked[x.id]) delete state.liked[x.id]; else state.liked[x.id] = true; save(); render(); };
      if (cur && cur.id === x.id) { cur.tile = t; play.textContent = '■'; play.setAttribute('aria-pressed', 'true'); }
      card.querySelector('.sounds').append(t);
    }
    grid.append(card);
  }
  if (!shown) grid.innerHTML = '<div class="empty">' + (onlyLiked ? 'Nothing liked yet.' : 'No sounds.') + '</div>';
  const total = man.synths.reduce((n, s) => n + s.sounds.filter(x => x.ok).length, 0);
  $('count').innerHTML = `<b>${likes}</b> liked of ${total} sounds · ${man.synths.length} synths`;
}
const play_ = (id, t) => play(id, t);
$('only').onclick = () => { onlyLiked = !onlyLiked; $('only').setAttribute('aria-pressed', String(onlyLiked)); render(); };
$('note').oninput = e => { state.note = e.target.value; save(); };

function save() {
  clearTimeout(saveTimer);
  if (!db) { status('Picks are not saved here (no database in this view).'); return; }
  saveTimer = setTimeout(async () => {
    try { await db.doc('picks/kerem').set({ liked: { ...state.liked }, note: state.note, savedAt: new Date().toISOString() }); status('Saved.'); }
    catch (e) { status('Could not save: ' + (e.message || e), true); }
  }, 400);
}

(async () => {
  try { man = await fetch('manifest.json').then(r => r.json()); }
  catch (e) { $('grid').innerHTML = '<div class="empty">Could not load the list of sounds.</div>'; return; }
  render();
  db = await window.claude?.use('db') ?? null;
  if (!db) { status('Picks will not be saved in this view.'); return; }
  try {
    const snap = await db.doc('picks/kerem').get();
    const d = snap.exists ? snap.data() : null;
    if (d) { state.liked = { ...(d.liked || {}) }; state.note = d.note || ''; $('note').value = state.note; render(); }
  } catch (e) { status('Could not read your earlier picks: ' + (e.message || e), true); }
})();
</script>
